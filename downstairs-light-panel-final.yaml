esphome:
  name: downstairs-light-panel
  friendly_name: Downstairs Light Panel

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  port: 6053
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Downstairs Panel Setup"
    password: !secret fallback_ap_password

captive_portal:

spi:
  id: lcd_spi
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  id: touch_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz
  scan: true

font:
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: ui_font
    size: 18
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: small_font
    size: 13

# page: 0=LIGHTS, 1=DIMMER, 2=COLORS, 3=WHITE, 4=RGB MIX.
globals:
  - { id: page, type: int, restore_value: false, initial_value: "0" }
  - { id: lights_subpage, type: int, restore_value: false, initial_value: "0" }
  - { id: selected, type: int, restore_value: false, initial_value: "0" }
  - { id: pressed_control, type: int, restore_value: false, initial_value: "-1" }
  - { id: touch_active, type: bool, restore_value: false, initial_value: "false" }
  - { id: slider_active, type: bool, restore_value: false, initial_value: "false" }
  - { id: pending_value, type: int, restore_value: false, initial_value: "50" }
  - { id: red_value, type: int, restore_value: false, initial_value: "255" }
  - { id: green_value, type: int, restore_value: false, initial_value: "255" }
  - { id: blue_value, type: int, restore_value: false, initial_value: "255" }
  - { id: kelvin_value, type: int, restore_value: false, initial_value: "3500" }
  - { id: slider_kind, type: int, restore_value: false, initial_value: "-1" }

